# BẢNG THUẬT NGỮ: bạn tự điền. Mục nào để trống bản dịch thì không được gửi cho model.
# Bản nháp tự động: python novel.py terms  → glossary_draft.yaml (duyệt rồi chép sang đây).
#
# - Mỗi lần gọi model chỉ gửi kèm những mục xuất hiện trong đoạn đang dịch, nên bảng dài cũng không sao.
# - Nhân vật (mục nhan_vat, hoặc có gioitinh/ngoi3) được gửi kèm nếu tên xuất hiện ở bất kỳ đâu
#   trong chương, vì "he/she" có thể chỉ nhân vật đó dù đoạn hiện tại không nhắc tên.
# - Tên gốc có chữ hoa: so khớp đúng hoa/thường. Viết thường toàn bộ: không phân biệt hoa/thường.
# - Sửa file này xong, chạy `python novel.py translate <các chương> --force`:
#   chỉ những đoạn có prompt thay đổi mới bị dịch lại, phần còn lại lấy từ cache.
#
# Dạng ngắn:      Tên gốc: Bản dịch
# Dạng đầy đủ:    Tên gốc:
#                   vi: Bản dịch
#                   gioitinh: nam | nữ
#                   ngoi3: cậu ta       # cách gọi ở ngôi thứ 3 trong lời kể: cậu ta / anh ta / hắn / cô ấy / nàng / lão...
#                   ghichu: 18 tuổi, quý tộc, tính cách...   # giúp model chọn giọng văn


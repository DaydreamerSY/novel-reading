# Dạng:   tên trong novelight: tên chuẩn (khoá trong glossary.yaml)
# Khi dựng nguồn từ novelight, các tên bên trái được đổi thành tên bên phải TRƯỚC khi tóm tắt / dịch,
# để glossary, xưng hô và kiểm tra tráo tên vẫn dùng một tên duy nhất. data/en_novelight giữ nguyên bản gốc.
# Số trong ghi chú: số lần xuất hiện ở novelight 754–971.


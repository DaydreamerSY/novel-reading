# NGỮ CẢNH TRUYỆN THEO GIAI ĐOẠN (số chương novelight). Lấy từ story/so_tay_cot_truyen.md.
# Được gửi kèm khi dịch, chỉnh xưng hô và phân xử: chỉ phần khớp với chương đang làm (arc của chương, nhân vật
# có mặt, quan hệ giữa những người có mặt), để model biết ai thiện / ác, thuộc phe nào, quan hệ đang ở đâu.
#
# chuong: khoảng chương, "1-123" hoặc "688-" (từ 688 trở đi). Mốc có "~" ở ghi chú là ước lượng, nên kiểm tra.
# nhan_vat → mỗi giai đoạn:
#   lap_truong: lập trường đối với Frondier (bạn, đồng minh, đối địch, kẻ thù, trung lập...)
#   vai_tro:    hoàn cảnh / vai trò ở giai đoạn đó
#   ngoi3:      người kể (Frondier, ngôi thứ nhất) gọi nhân vật này trong lời kể là gì: "anh ấy", "anh ta",
#               "hắn", "cô ấy", "cô ta", "nàng", "cậu", "ông", "bà", "lão", "nó"... Có thể thay bằng tên khi
#               câu vẫn rõ nghĩa. Ở chương kể ngôi thứ ba theo góc nhìn nhân vật khác, model tự điều chỉnh.
# quan_he → "A – B" (không phân chiều), mỗi giai đoạn một trạng thái.
# ghi_chu → lưu ý xưng hô cho một chương / một cảnh, nhất là với nhân vật không tên (quy tắc xưng hô trong
#           glossary chỉ đặt được cho nhân vật có tên). Model được yêu cầu làm theo.

